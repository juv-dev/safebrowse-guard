<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SafeBrowse Guard - Opciones</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.5}
label{display:block;margin:18px 0}.box{padding:20px;border:1px solid #ddd;border-radius:14px}
button{padding:9px 14px} .ok{margin-left:10px}
</style>
</head>
<body>
<h1>SafeBrowse Guard</h1>
<div class="box">
<label><input type="checkbox" id="enabled"> Activar filtro</label>
<label><input type="checkbox" id="strictUnknown"> Modo estricto: si una página de anime no puede identificarse con suficiente confianza, bloquearla.</label>
<button id="save">Guardar</button><span class="ok" id="status"></span>
</div>
<p>Excepciones incluidas de fábrica: Manga-Oni para Blue Lock, Wind Breaker y One Piece.</p>
<script src="options.js"></script>
</body>
</html>
