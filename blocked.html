<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contenido bloqueado</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#111827;color:#f9fafb;margin:0;display:grid;place-items:center;min-height:100vh}
.card{max-width:720px;margin:24px;padding:32px;border:1px solid #374151;border-radius:18px;background:#1f2937}
h1{margin-top:0;font-size:28px} .muted{color:#9ca3af;word-break:break-word}
li{margin:8px 0} button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>🚫 Contenido bloqueado</h1>
<p>Anime Guard Strict encontró una señal que coincide con tu política de bloqueo.</p>
<ul id="reasons"></ul>
<p class="muted" id="url"></p>
<button id="back">Volver</button>
</div>
<script src="blocked.js"></script>
</body>
</html>
