name: Release tag

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and draft release for the current version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version package.json)"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; nothing to do."
            exit 0
          fi
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "${tag}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; tag pushed, leaving the release untouched."
            exit 0
          fi
          gh release create "${tag}" --draft --title "${tag}" --generate-notes
