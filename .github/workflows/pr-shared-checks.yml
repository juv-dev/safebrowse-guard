name: Workflow PR Shared Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  no-ai-artifacts:
    name: no-ai-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: juv-dev/workflows-frontend/.github/actions/no-ai-artifacts@main

  vulnerability-scan:
    name: vulnerability-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: juv-dev/workflows-frontend/.github/actions/vulnerability-scan@main

  supply-chain:
    name: supply-chain
    needs: vulnerability-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: juv-dev/workflows-frontend/.github/actions/supply-chain@main
